decoration {
    rounding = 12

    blur {
        enabled = true
        size = 6           # Tamaño del desenfoque
        passes = 3         # Cantidad de pasadas (3 da el efecto cristal perfecto)
        new_optimizations = true
        ignore_opacity = true # Obliga a que el blur se aplique a tu terminal transparente
    }

    drop_shadow = true
    shadow_range = 15
    shadow_render_power = 3
    col.shadow = rgba(00000055)
}

animations {
    enabled = true

    # Curvas de animación (rebote suave y elegante)
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = fade, 1, 10, smoothIn
    animation = workspaces, 1, 6, default, slidefade 20%
}
